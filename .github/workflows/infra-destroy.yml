name: infra-destroy

# Run by hand to delete every resource in infra/ and stop all charges. The state
# bucket and the credentials stay. A push to main that touches infra/ (or a
# re-run of the infra workflow on main) recreates everything.
on:
  workflow_dispatch:

permissions:
  contents: read

# Same group as infra main runs, so a destroy never overlaps an apply.
concurrency:
  group: infra-main
  cancel-in-progress: false

env:
  TOFU_VERSION: "1.12.6"
  OS_AUTH_TYPE: v3applicationcredential
  OS_AUTH_URL: https://api.pub1.infomaniak.cloud/identity/v3
  OS_REGION_NAME: dc3-a
  OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.OS_APPLICATION_CREDENTIAL_ID }}
  OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.OS_APPLICATION_CREDENTIAL_SECRET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_ssh_allowed_cidrs: ${{ secrets.SSH_ALLOWED_CIDRS }}
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    working-directory: infra

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      # The repo is public: hide each allowed CIDR (a home IP) from the logs.
      - name: Mask allowed SSH CIDRs
        run: jq -r '.[]' <<< "$TF_VAR_ssh_allowed_cidrs" | sed 's/^/::add-mask::/'

      - run: tofu init -input=false
      - run: tofu destroy -input=false -auto-approve
